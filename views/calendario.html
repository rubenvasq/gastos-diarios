<template x-if="view === 'calendario'">
<section id="view-calendario" x-cloak class="scroll-mt-24 space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-bold tracking-tight">Calendario</h2>
              <p class="text-sm text-slate-400 mt-0.5" x-text="monthLabel"></p>
            </div>
            <button @click="goToToday" class="btn-ghost"><i data-lucide="calendar-days" class="w-4 h-4 text-accent"></i> Ir a hoy</button>
          </div>

          <!-- Leyenda y totales -->
          <div class="card p-5 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4 text-xs text-slate-500 dark:text-slate-400">
              <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-slate-100 dark:bg-slate-800"></span> Sin gastos</span>
              <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded" style="background:rgba(244,63,94,.25)"></span> Bajo</span>
              <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded" style="background:rgba(244,63,94,.55)"></span> Medio</span>
              <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded" style="background:rgba(244,63,94,.9)"></span> Alto</span>
            </div>
            <div class="flex items-center gap-5 text-sm">
              <span>Total mes: <b class="tabular-nums" x-text="fmt(calendarMonthTotal)"></b></span>
              <span class="text-slate-400" x-text="`${calendarSpendDays} día(s) con gastos`"></span>
            </div>
          </div>

          <!-- Cuadrícula -->
          <div class="card p-5">
            <div class="grid grid-cols-7 gap-1 mb-2">
              <template x-for="(wd, i) in ['L', 'M', 'X', 'J', 'V', 'S', 'D']" :key="i">
                <div class="text-center text-[11px] font-bold uppercase tracking-wider text-slate-400 py-1" x-text="wd"></div>
              </template>
            </div>
            <div class="grid grid-cols-7 gap-1">
              <template x-for="(c, i) in calendarCells" :key="i">
                <div>
                  <template x-if="!c.empty">
                    <div @click="selectedDay = c.date"
                      class="min-h-[76px] sm:min-h-[96px] rounded-2xl border p-2 cursor-pointer transition hover:-translate-y-0.5 hover:shadow-md"
                      :class="c.date === selectedDay ? 'border-accent ring-2 ring-accent/30' : c.isToday ? 'border-accent/60' : 'border-slate-100 dark:border-slate-800'"
                      :style="c.total > 0 ? `background:rgba(244,63,94,${0.05 + c.ratio * 0.45})` : ''">
                      <div class="flex items-center justify-between mb-1">
                        <span class="text-sm font-semibold tabular-nums" :class="c.isToday ? 'text-accent' : ''" x-text="c.day"></span>
                        <span x-show="c.count > 0" class="w-4 h-4 rounded-full bg-white/70 dark:bg-slate-700/70 text-[9px] font-bold text-slate-500 dark:text-slate-300 grid place-items-center" x-text="c.count"></span>
                      </div>
                      <p x-show="c.total > 0" class="text-[10px] sm:text-[11px] font-semibold tabular-nums truncate" :class="c.ratio > 0.6 ? 'text-white/90' : 'text-slate-600 dark:text-slate-300'" x-text="compactFmt(c.total)"></p>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>

          <!-- Detalle del día -->
          <div class="card p-5">
            <template x-if="selectedDay">
              <div>
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                  <h3 class="font-bold flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4 text-accent"></i> <span x-text="dateLabel(selectedDay)"></span></h3>
                  <span class="chip bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-[11px]"
                    x-text="`${selectedDayTx.filter(t => t.kind === 'expense').reduce((s, t) => s + t.rec.amount, 0) > 0 ? 'Gastado ' + fmt(selectedDayTx.filter(t => t.kind === 'expense').reduce((s, t) => s + t.rec.amount, 0)) : 'Sin gastos'}`"></span>
                </div>
                <template x-if="selectedDayTx.length === 0">
                  <p class="text-sm text-slate-400 py-6 text-center">Sin movimientos este día. <button @click="openTxModal('expense')" class="text-accent font-semibold hover:underline">Registrar uno</button></p>
                </template>
                <ul class="divide-y divide-slate-100 dark:divide-slate-800">
                  <template x-for="t in selectedDayTx" :key="t.rec.id">
                    <li class="flex items-center gap-3 py-3">
                      <div class="w-9 h-9 rounded-xl grid place-items-center shrink-0"
                        :class="t.kind === 'income' ? 'bg-emerald-50 text-emerald-500 dark:bg-emerald-500/10 dark:text-emerald-400' : t.kind === 'transfer' ? 'bg-sky-50 text-sky-500 dark:bg-sky-500/10 dark:text-sky-400' : ''"
                        :style="t.kind === 'expense' ? `background:${t.cat.color}1a; color:${t.cat.color}` : ''">
                        <i x-show="t.kind === 'income'" data-lucide="arrow-down-left" class="w-4 h-4"></i>
                        <i x-show="t.kind === 'transfer'" data-lucide="arrow-right-left" class="w-4 h-4"></i>
                        <i x-show="t.kind === 'expense'" :data-lucide="t.cat.icon" class="w-4 h-4"></i>
                      </div>
                      <div class="flex-1 min-w-0">
                        <p class="font-medium text-sm truncate" x-text="t.rec.description || (t.kind === 'income' ? 'Ingreso' : t.kind === 'transfer' ? 'Transferencia' : t.cat.label)"></p>
                        <p class="text-xs text-slate-400 truncate" x-text="`${t.acct.name}${t.toAcct ? ' → ' + t.toAcct.name : ''}`"></p>
                      </div>
                      <span class="font-semibold tabular-nums text-sm" :class="t.kind === 'income' ? 'text-emerald-600 dark:text-emerald-400' : t.kind === 'transfer' ? 'text-sky-500' : ''">
                        <span x-show="t.kind === 'income'">+</span><span x-show="t.kind === 'expense'">−</span><span x-text="fmt(t.rec.amount)"></span>
                      </span>
                      <button @click="removeTx(t)" class="btn-icon w-8 h-8 hover:bg-rose-50 hover:text-rose-500 dark:hover:bg-rose-500/10" title="Eliminar">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
            <template x-if="!selectedDay">
              <p class="text-sm text-slate-400 py-4 text-center">Selecciona un día del calendario para ver sus movimientos.</p>
            </template>
          </div>
        </section>
</template>
