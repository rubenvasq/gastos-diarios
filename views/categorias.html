<template x-if="view === 'categorias'">
<section id="view-categorias" x-cloak class="scroll-mt-24 space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-bold tracking-tight">Categorías</h2>
              <p class="text-sm text-slate-400 mt-0.5">Organiza tus gastos. No se eliminan categorías con movimientos sin reasignarlos.</p>
            </div>
            <button @click="openCatModal()" class="btn-primary hover:-translate-y-px">
              <i data-lucide="plus" class="w-4 h-4"></i> Nueva categoría
            </button>
          </div>

          <div class="grid grid-cols-12 gap-4">
            <template x-for="c in categories" :key="c.id">
              <div class="col-span-12 sm:col-span-6 lg:col-span-4 xl:col-span-3 card p-4 group">
                <div class="flex items-center gap-3">
                  <div class="w-11 h-11 rounded-2xl grid place-items-center shrink-0" :style="`background:${c.color}1a; color:${c.color}`">
                    <i :data-lucide="c.icon" class="w-5 h-5"></i>
                  </div>
                  <div class="flex-1 min-w-0">
                    <p class="font-semibold text-sm truncate" x-text="c.label"></p>
                    <p class="text-xs text-slate-400" x-text="`${categoryUsage(c.id)} movimiento(s)`"></p>
                  </div>
                  <span class="text-lg" x-text="c.emoji"></span>
                </div>
                <div class="flex items-center justify-end gap-1 mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition">
                  <button @click="openCatModal(c)" class="btn-icon w-8 h-8" title="Editar"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                  <button @click="deleteCategory(c)" class="btn-icon w-8 h-8 hover:bg-rose-50 hover:text-rose-500 dark:hover:bg-rose-500/10" title="Eliminar"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
              </div>
            </template>
          </div>
        </section>
</template>
