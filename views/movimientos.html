<template x-if="view === 'movimientos'">
<section id="view-movimientos" x-cloak class="scroll-mt-24 space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-bold tracking-tight">Movimientos</h2>
              <p class="text-sm text-slate-400 mt-0.5" x-text="monthLabel"></p>
            </div>
            <button @click="openTxModal('expense')" class="btn-primary hover:-translate-y-px">
              <i data-lucide="plus" class="w-4 h-4"></i> Nuevo movimiento
            </button>
          </div>

          <!-- Filtros -->
          <div class="card p-5 space-y-4">
            <div class="flex flex-wrap items-center gap-3">
              <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 rounded-full px-4 h-10 flex-1 min-w-[220px] transition focus-within:ring-4 focus-within:ring-accent/15 focus-within:bg-white dark:focus-within:bg-slate-800">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
                <input type="text" x-model.debounce.250ms="search" placeholder="Buscar por descripción, categoría o cuenta…" class="flex-1 bg-transparent outline-none text-sm placeholder:text-slate-400 min-w-0">
              </div>
              <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 rounded-full p-1 text-xs">
                <button @click="txFilter = 'all'" class="px-3 py-1.5 rounded-full font-medium transition" :class="txFilter === 'all' ? 'bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400'">Todos</button>
                <button @click="txFilter = 'expense'" class="px-3 py-1.5 rounded-full font-medium transition" :class="txFilter === 'expense' ? 'bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400'">Gastos</button>
                <button @click="txFilter = 'income'" class="px-3 py-1.5 rounded-full font-medium transition" :class="txFilter === 'income' ? 'bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400'">Ingresos</button>
                <button @click="txFilter = 'transfer'" class="px-3 py-1.5 rounded-full font-medium transition" :class="txFilter === 'transfer' ? 'bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400'">Transferencias</button>
              </div>
            </div>

            <div class="flex flex-wrap items-end gap-3">
              <div class="w-full sm:w-44">
                <label class="form-label">Cuenta</label>
                <select x-model="txAccount" class="field text-sm">
                  <option value="all">Todas</option>
                  <template x-for="a in accounts" :key="a.id">
                    <option :value="a.id" x-text="a.name"></option>
                  </template>
                </select>
              </div>
              <div class="w-full sm:w-44">
                <label class="form-label">Categoría</label>
                <select x-model="txCategory" class="field text-sm">
                  <option value="all">Todas</option>
                  <template x-for="c in categories" :key="c.id">
                    <option :value="c.id" x-text="c.label"></option>
                  </template>
                </select>
              </div>
              <div class="w-full sm:w-40">
                <label class="form-label">Desde</label>
                <input type="date" x-model="dateFrom" class="field text-sm">
              </div>
              <div class="w-full sm:w-40">
                <label class="form-label">Hasta</label>
                <input type="date" x-model="dateTo" class="field text-sm">
              </div>
              <div class="w-full sm:w-44">
                <label class="form-label">Ordenar por</label>
                <select x-model="sortBy" class="field text-sm">
                  <option value="date">Fecha</option>
                  <option value="amount">Monto</option>
                  <option value="description">Descripción</option>
                </select>
              </div>
              <button @click="sortDir = sortDir === 'asc' ? 'desc' : 'asc'" class="btn-ghost" :title="sortDir === 'asc' ? 'Ascendente' : 'Descendente'">
                <i :data-lucide="sortDir === 'asc' ? 'arrow-up' : 'arrow-down'" class="w-4 h-4"></i>
                <span x-text="sortDir === 'asc' ? 'Asc' : 'Desc'"></span>
              </button>
              <button x-show="hasActiveFilters" @click="clearTxFilters" class="btn-ghost text-rose-500 border-rose-200 dark:border-rose-500/30">
                <i data-lucide="x" class="w-4 h-4"></i> Limpiar filtros
              </button>
            </div>

            <div class="flex flex-wrap items-center gap-4 text-xs text-slate-400 pt-1 border-t border-slate-100 dark:border-slate-800">
              <span x-text="`${filteredTx.length} movimiento(s)`"></span>
              <template x-if="filteredTotals.expenses > 0">
                <span>Gastos: <b class="text-rose-500 tabular-nums" x-text="fmt(filteredTotals.expenses)"></b></span>
              </template>
              <template x-if="filteredTotals.income > 0">
                <span>Ingresos: <b class="text-emerald-500 tabular-nums" x-text="fmt(filteredTotals.income)"></b></span>
              </template>
            </div>
          </div>

          <!-- Tabla (desktop) -->
          <template x-if="filteredTx.length > 0">
            <div class="card p-0 overflow-hidden hidden md:block">
              <div class="overflow-x-auto">
                <table class="w-full text-left">
                  <thead>
                    <tr class="text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-100 dark:border-slate-800">
                      <th class="py-3.5 px-5 font-semibold">Movimiento</th>
                      <th class="py-3.5 px-3 font-semibold hidden xl:table-cell">Categoría</th>
                      <th class="py-3.5 px-3 font-semibold hidden lg:table-cell">Cuenta</th>
                      <th class="py-3.5 px-3 font-semibold">Fecha</th>
                      <th class="py-3.5 px-3 font-semibold">Tipo</th>
                      <th class="py-3.5 px-3 font-semibold text-right">Valor</th>
                      <th class="py-3.5 px-5"></th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                    <template x-for="t in visibleTx" :key="t.rec.id">
                      <tr class="group hover:bg-slate-50/70 dark:hover:bg-slate-800/40">
                        <td class="py-3.5 px-5">
                          <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl grid place-items-center shrink-0"
                              :class="t.kind === 'income' ? 'bg-emerald-50 text-emerald-500 dark:bg-emerald-500/10 dark:text-emerald-400' : t.kind === 'transfer' ? 'bg-sky-50 text-sky-500 dark:bg-sky-500/10 dark:text-sky-400' : ''"
                              :style="t.kind === 'expense' ? `background:${t.cat.color}1a; color:${t.cat.color}` : ''">
                              <i x-show="t.kind === 'income'" data-lucide="arrow-down-left" class="w-[18px] h-[18px]"></i>
                              <i x-show="t.kind === 'transfer'" data-lucide="arrow-right-left" class="w-[18px] h-[18px]"></i>
                              <i x-show="t.kind === 'expense'" :data-lucide="t.cat?.icon" class="w-[18px] h-[18px]"></i>
                            </div>
                            <div class="min-w-0 max-w-[260px]">
                              <p class="font-medium text-sm truncate" x-text="t.rec.description || (t.kind === 'income' ? 'Ingreso' : t.kind === 'transfer' ? 'Transferencia' : t.cat.label)"></p>
                              <p x-show="t.rec.note" class="text-xs text-slate-400 truncate" x-text="t.rec.note"></p>
                            </div>
                          </div>
                        </td>
                        <td class="py-3.5 px-3 hidden xl:table-cell text-sm text-slate-500 dark:text-slate-400">
                          <span x-text="t.kind === 'expense' ? t.cat.label : '—'"></span>
                          <span x-show="receiptsFor(t.rec.id).length > 0" class="ml-1 inline-flex items-center gap-1 text-[10px] font-semibold text-accent align-middle" title="Tiene comprobantes">
                            <i data-lucide="paperclip" class="w-3 h-3"></i>
                          </span>
                        </td>
                        <td class="py-3.5 px-3 hidden lg:table-cell">
                          <span class="inline-flex items-center gap-1.5 text-sm text-slate-500 dark:text-slate-400">
                            <i :data-lucide="t.acct.icon" class="w-4 h-4 text-slate-400"></i>
                            <span class="truncate" x-text="t.toAcct ? `${t.acct.name} → ${t.toAcct.name}` : t.acct.name"></span>
                          </span>
                        </td>
                        <td class="py-3.5 px-3 text-sm text-slate-500 dark:text-slate-400 whitespace-nowrap">
                          <span class="tabular-nums" x-text="tableDate(t.rec.date)"></span>
                          <span x-show="t.rec.createdAt" class="block text-[11px] text-slate-400 dark:text-slate-500" x-text="$data.relativeTime(t.rec.createdAt)" :title="t.rec.createdAt ? new Date(t.rec.createdAt).toLocaleString($data.locale()) : ''"></span>
                        </td>
                        <td class="py-3.5 px-3">
                          <span class="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-semibold whitespace-nowrap" :class="txStatus(t).cls">
                            <i :data-lucide="txStatus(t).icon" class="w-3.5 h-3.5"></i>
                            <span x-text="txStatus(t).label"></span>
                          </span>
                        </td>
                        <td class="py-3.5 px-3 text-right">
                          <span class="font-semibold tabular-nums text-sm" :class="t.kind === 'income' ? 'text-emerald-600 dark:text-emerald-400' : t.kind === 'transfer' ? 'text-sky-500' : 'text-slate-900 dark:text-slate-100'">
                            <span x-show="t.kind === 'income'">+</span><span x-show="t.kind === 'expense'">−</span><span x-text="fmt(t.rec.amount)"></span>
                          </span>
                        </td>
                        <td class="py-3.5 px-5">
                          <div class="flex items-center justify-end gap-1 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition">
                            <button @click="openTxModal(t.kind, t.rec)" class="w-8 h-8 rounded-full grid place-items-center text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800" title="Editar">
                              <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            <button @click="duplicateTx(t)" class="w-8 h-8 rounded-full grid place-items-center text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800" title="Duplicar">
                              <i data-lucide="copy" class="w-4 h-4"></i>
                            </button>
                            <button @click="removeTx(t)" class="w-8 h-8 rounded-full grid place-items-center text-slate-400 transition hover:bg-rose-50 hover:text-rose-500 dark:hover:bg-rose-500/10" title="Eliminar">
                              <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>

          <!-- Tarjetas (móvil) -->
          <template x-if="filteredTx.length > 0">
            <div class="space-y-3 md:hidden">
              <template x-for="t in visibleTx" :key="t.rec.id">
                <div class="card p-4">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl grid place-items-center shrink-0"
                      :class="t.kind === 'income' ? 'bg-emerald-50 text-emerald-500 dark:bg-emerald-500/10 dark:text-emerald-400' : t.kind === 'transfer' ? 'bg-sky-50 text-sky-500 dark:bg-sky-500/10 dark:text-sky-400' : ''"
                      :style="t.kind === 'expense' ? `background:${t.cat.color}1a; color:${t.cat.color}` : ''">
                      <i x-show="t.kind === 'income'" data-lucide="arrow-down-left" class="w-[18px] h-[18px]"></i>
                      <i x-show="t.kind === 'transfer'" data-lucide="arrow-right-left" class="w-[18px] h-[18px]"></i>
                      <i x-show="t.kind === 'expense'" :data-lucide="t.cat?.icon" class="w-[18px] h-[18px]"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <p class="font-medium text-sm truncate" x-text="t.rec.description || (t.kind === 'income' ? 'Ingreso' : t.kind === 'transfer' ? 'Transferencia' : t.cat.label)"></p>
                      <p class="text-xs text-slate-400 truncate" x-text="`${tableDate(t.rec.date)} · ${t.acct.name}${t.toAcct ? ' → ' + t.toAcct.name : ''} · ${txStatus(t).label}`"></p>
                      <p x-show="t.rec.createdAt" class="text-[11px] text-slate-400 dark:text-slate-500 truncate" x-text="$data.relativeTime(t.rec.createdAt)"></p>
                    </div>
                    <span class="font-semibold tabular-nums text-sm shrink-0" :class="t.kind === 'income' ? 'text-emerald-600 dark:text-emerald-400' : t.kind === 'transfer' ? 'text-sky-500' : 'text-slate-900 dark:text-slate-100'">
                      <span x-show="t.kind === 'income'">+</span><span x-show="t.kind === 'expense'">−</span><span x-text="fmt(t.rec.amount)"></span>
                    </span>
                  </div>
                  <div class="flex items-center justify-end gap-2 mt-3 pt-3 border-t border-slate-100 dark:border-slate-800">
                    <button @click="openTxModal(t.kind, t.rec)" class="btn-ghost py-1.5 px-3 text-xs"><i data-lucide="pencil" class="w-3.5 h-3.5"></i> Editar</button>
                    <button @click="duplicateTx(t)" class="btn-ghost py-1.5 px-3 text-xs"><i data-lucide="copy" class="w-3.5 h-3.5"></i> Duplicar</button>
                    <button @click="removeTx(t)" class="btn-ghost py-1.5 px-3 text-xs text-rose-500 border-rose-200 dark:border-rose-500/30"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- Paginación -->
          <template x-if="hiddenTxCount > 0">
            <div class="flex justify-center pt-2">
              <button @click="expandTx" class="btn-ghost text-accent"><i data-lucide="chevron-down" class="w-4 h-4"></i> Mostrar <span x-text="hiddenTxCount"></span> más</button>
            </div>
          </template>
          <template x-if="txExpanded && filteredTx.length > txLimit">
            <div class="flex justify-center pt-2">
              <button @click="collapseTx" class="btn-ghost"><i data-lucide="chevron-up" class="w-4 h-4"></i> Mostrar menos</button>
            </div>
          </template>

          <!-- Estado vacío -->
          <template x-if="filteredTx.length === 0">
            <div class="card text-center py-16">
              <div class="w-16 h-16 mx-auto mb-4 rounded-3xl bg-slate-100 dark:bg-slate-800 grid place-items-center">
                <i data-lucide="receipt" class="w-8 h-8 text-slate-300 dark:text-slate-600"></i>
              </div>
              <p class="font-semibold" x-text="hasActiveFilters ? 'Sin movimientos que coincidan con los filtros' : 'No tienes movimientos todavía'"></p>
              <p class="text-sm text-slate-400 mt-1 mb-5">Usa el botón + para registrar tu primer movimiento.</p>
              <template x-if="!hasActiveFilters">
                <button @click="openTxModal('expense')" class="btn-ghost text-accent"><i data-lucide="plus" class="w-4 h-4"></i> Agregar primer movimiento</button>
              </template>
            </div>
          </template>
        </section>
</template>
