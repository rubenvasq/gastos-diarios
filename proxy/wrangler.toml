name = "gastos-ai"
main = "worker.js"
compatibility_date = "2024-11-01"

# Orígenes permitidos para CORS (separados por comas). Producción (GitHub Pages)
# + desarrollo local. Así solo tu sitio y tu máquina pueden usar el proxy.
[vars]
ALLOWED_ORIGIN = "https://rubenvasq.github.io,http://localhost:3000"

# La API key de Groq NO va aquí. Se guarda como secret (encriptada) con:
#   wrangler secret put GROQ_KEY
